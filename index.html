<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXA VIP PANEL</title>
<style>
body{background:#060606;color:#fff;font-family:Arial;text-align:center;margin:0}
.card{background:#111;border:1px solid #00ff88;border-radius:15px;padding:15px;margin:10px}
.btn{width:100%;padding:12px;margin:6px 0;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:10px;font-weight:bold;text-align:left}
.btn.active{background:#00ff88;color:#000;border-color:#00ff88}
.main-btn{background:#00ff88;color:#000;padding:15px 30px;border:none;border-radius:12px;font-weight:bold;font-size:16px;width:90%;margin-top:10px}
#L{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;justify-content:center;align-items:center}
</style>
</head>
<body>
<div id="L">
<div style="background:#111;border:2px solid #00ff88;padding:25px;border-radius:15px;width:85%;max-width:300px">
<h2 style="color:#00ff88">AXA VIP</h2>
<input id="k" placeholder="Enter Key" style="width:90%;padding:12px;margin:5px;background:#000;color:#fff;border:1px solid #333;border-radius:8px"><br>
<input id="p" type="password" placeholder="Password" style="width:90%;padding:12px;margin:5px;background:#000;color:#fff;border:1px solid #333;border-radius:8px"><br>
<button onclick="C()" style="width:95%;padding:12px;background:#00ff88;border:none;border-radius:8px;font-weight:bold;margin-top:10px">LOGIN</button>
<p id="e" style="color:#ff4444"></p>
<p style="font-size:11px;color:#555">Key: AXA-7392 / Pass: 7392</p>
</div>
</div>
<script>
var K={"AXA-7392":"7392","AXA-FREE":"0000","AXA-VIP":"9999"};
function C(){var a=document.getElementById('k').value.trim(),b=document.getElementById('p').value.trim();if(K[a]==b){document.getElementById('L').style.display='none';localStorage.setItem('axa','ok')}else{document.getElementById('e').innerText='Wrong Key/Password'}}
if(location.search.includes('logout')){localStorage.removeItem('axa');location.href=location.pathname}
if(localStorage.getItem('axa')=='ok'){document.getElementById('L').style.display='none'}
function T(el){el.classList.toggle('active')}
function logout(){localStorage.removeItem('axa');location.reload()}
</script>
<div style="padding:10px">

<div class="card"><h4 style="color:#00ff88;margin:5px">🎯 AIMBOT</h4>
<button class="btn" onclick="T(this)">🎯 Aimbot Head - OFF</button>
<button class="btn" onclick="T(this)">🎯 Aimbot Neck - OFF</button>
<button class="btn" onclick="T(this)">⚡ No Recoil - OFF</button>
<button class="btn" onclick="T(this)">🔫 Aim FOV 360 - OFF</button>
</div>
<div class="card"><h4 style="color:#00ff88;margin:5px">👁️ ESP</h4>
<button class="btn" onclick="T(this)">👤 ESP Line - OFF</button>
<button class="btn" onclick="T(this)">📦 ESP Box - OFF</button>
<button class="btn" onclick="T(this)">❤️ ESP Health - OFF</button>
<button class="btn" onclick="T(this)">📍 ESP Distance - OFF</button>
</div>
<div class="card"><h4 style="color:#00ff88;margin:5px">⚙️ OTHER</h4>
<button class="btn" onclick="T(this)">🏃 Speed Hack - OFF</button>
<button class="btn" onclick="T(this)">👻 Ghost Hack - OFF</button>
<button class="btn" onclick="T(this)">🧱 Wall Hack - OFF</button>
</div>
<button class="main-btn" onclick="alert('Injected! (Demo UI)')">🚀 INJECT NOW</button>
<br><br>
<button onclick="logout()" style="background:transparent;color:#555;border:1px solid #222;padding:8px 20px;border-radius:20px;font-size:12px">LOGOUT</button>
<p style="color:#333;font-size:10px;margin-top:15px">AXA TEAM © 2026</p>
</div>
</body>
</html>
