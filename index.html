<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXA PANEL</title></head>
<body style="background:#000;color:#fff;text-align:center;font-family:Arial">
<div id="L" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;justify-content:center;align-items:center">
<div style="background:#111;border:2px solid #00ff88;padding:20px;border-radius:15px;width:85%;max-width:300px">
<h3 style="color:#00ff88">AXA LOGIN</h3>
<input id="k" placeholder="Enter Key" style="width:90%;padding:12px;margin:5px;background:#000;color:#fff;border:1px solid #333;border-radius:8px"><br>
<input id="p" type="password" placeholder="Password" style="width:90%;padding:12px;margin:5px;background:#000;color:#fff;border:1px solid #333;border-radius:8px"><br>
<button onclick="C()" style="width:95%;padding:12px;background:#00ff88;border:none;border-radius:8px;font-weight:bold;margin-top:10px">LOGIN</button>
<p id="e" style="color:red"></p>
<p style="font-size:11px;color:#666">Demo: AXA-1234 / 1111</p>
</div></div>
<script>
var K={"AXA-1234":"1111","AXA-FREE":"0000"};
function C(){var a=document.getElementById('k').value.trim(),b=document.getElementById('p').value.trim();if(K[a]==b){document.getElementById('L').style.display='none';localStorage.setItem('axa','ok')}else{document.getElementById('e').innerText='Wrong Key/Password'}}
if(localStorage.getItem('axa')=='ok'){document.getElementById('L').style.display='none'}
</script>
<h2 style="color:#00ff88;margin-top:60px">🔥 AXA PANEL READY 🔥</h2>
<button style="background:#00ff88;padding:15px 30px;border:none;border-radius:10px;font-weight:bold">INJECT</button>
</body></html>
