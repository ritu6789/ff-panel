<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif}
.box{border:2px solid #00ff7f;border-radius:20px;padding:30px;width:85%;max-width:350px;background:#0a0a0a;text-align:center}
h1{color:#00ff7f}
input{width:100%;padding:14px;margin:10px 0;background:#000;border:1px solid #333;color:#fff;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;background:#00ff7f;border:0;border-radius:10px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<div class="box">
<h1>AXA VIP</h1>
<input id="k" placeholder="Enter Key (e.g. AXA-VIP)">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>
<script>
function login(){
if(document.getElementById('k').value=='AXA-VIP' && document.getElementById('p').value=='9999'){
localStorage.setItem('axa','ok');
location.href='panel.html';
}else{alert('Wrong Key or Password');}
}
</script>
</body>
</html>
